<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Home HQ</title>
<meta name="theme-color" content="#121417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home HQ">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --ground:#121417; --card:#1C1F23; --sunk:#16181B; --line:#2E3237; --edge:#3A3E44; --text:#EDEAE4; --text-2:#C9C5BD; --muted:#A7A39B; --faint:#8A867F;
  --green:#7FC8A9; --green-bg:#2A3B33; --green-ink:#BFEBD6; --today-bg:#2A2418; --today-ink:#FFD08A; --accent:#F2A541; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--ground); color: var(--text); font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
main { max-width: 560px; margin: 0 auto; padding: calc(22px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
.kicker { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 34px; line-height: 1.05; }
.sub { font-size: 15px; color: var(--text-2); margin-top: 4px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.round { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--edge); background: var(--card); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.pill { height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--edge); background: var(--card); font-size: 15px; font-weight: 700; color: var(--green-ink); }
.pill:disabled { color: var(--faint); font-weight: 400; cursor: default; }
.people { display: flex; flex-wrap: wrap; gap: 8px; }
.person { min-height: 44px; padding: 0 16px 0 12px; border-radius: 22px; border: 1px solid var(--edge); background: var(--card); font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.person[aria-pressed=true] { background: var(--green-bg); border-color: var(--green); color: var(--green-ink); font-weight: 700; }
.pdot { width: 10px; height: 10px; border-radius: 5px; flex: none; }
.fixed { flex: 1 1 auto; min-width: 0; min-height: 48px; padding: 6px 14px; border-radius: 12px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 17px; color: var(--text-2); }
.tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #1E2E42; color: #9CC4F0; flex: none; }
.hint { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--edge); background: var(--card); font-size: 15px; }
.days { display: flex; flex-direction: column; gap: 6px; }
.day { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border-radius: 16px; }
.day.today { background: var(--today-bg); }
.dl { width: 52px; flex: none; display: flex; flex-direction: column; line-height: 1.1; }
.dow { font-size: 14px; font-weight: 700; color: var(--muted); }
.date { font-family: 'Outfit', sans-serif; font-size: 22px; }
.day.today .dow, .day.today .date { color: var(--today-ink); }
input[type=text] { width: 100%; min-width: 0; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 17px; }
input[type=text]::placeholder { color: var(--faint); }
input[type=text]:focus { outline: none; border-color: var(--green); background: var(--sunk); }
.saved { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.addrow { display: flex; gap: 8px; }
.addrow input { height: 52px; border-radius: 14px; border-color: var(--edge); }
.plus { width: 52px; height: 52px; flex: none; border-radius: 14px; border: 0; background: var(--green); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.list { display: flex; flex-direction: column; }
.item { min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; font-size: 18px; width: 100%; }
.box { width: 24px; height: 24px; flex: none; border-radius: 12px; border: 2px solid var(--faint); }
.empty { padding: 28px 4px; font-size: 16px; color: var(--muted); }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--sunk); }
nav button { position: relative; min-height: 56px; border-radius: 14px; border: 0; background: transparent; color: var(--text-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; }
nav .badge { position: absolute; top: 4px; left: calc(50% + 6px); }
nav button[aria-current=page] { background: var(--green-bg); color: var(--green-ink); font-weight: 700; }
.badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--accent); color: #1A1408; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 18px; min-height: 60px; border-radius: 16px; background: var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 16px; }
#toast button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--green); color: #10251B; font-weight: 700; }
.status { font-size: 13px; color: var(--muted); text-align: center; }
.setup p { font-size: 16px; line-height: 1.5; color: var(--text-2); margin: 12px 0 18px; }
.go { min-height: 52px; padding: 0 22px; border: 0; border-radius: 14px; background: var(--green); color: #10251B; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
<main>
  <section id="v-setup" class="setup" hidden>
    <div class="kicker">Home HQ</div>
    <h1>Connect</h1>
    <p>Open the Home HQ link you were sent, or paste it here.</p>
    <form id="setupform" autocomplete="off" style="display:flex;flex-direction:column;gap:12px">
      <input type="text" id="setupbox" placeholder="Paste the Home HQ link" aria-label="Home HQ link" autocapitalize="off" spellcheck="false">
      <button class="go" type="submit">Connect</button>
    </form>
  </section>

  <section id="v-dinners" aria-labelledby="h-dinners" hidden>
    <div class="head">
      <div>
        <div class="kicker">Home HQ</div>
        <h1 id="h-dinners">Dinners</h1>
        <div class="sub" id="d-sub">&nbsp;</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="pill" id="today" type="button" aria-label="Back to this week">Today</button>
        <button class="round" id="prev" aria-label="Previous week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="round" id="next" aria-label="Next week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div id="picks-wrap" style="margin-top:18px" hidden>
      <div class="hint">Quick picks — tap to fill the next open night</div>
      <div class="chips" id="picks"></div>
    </div>
    <div class="days" id="days" style="margin-top:18px"></div>
    <div class="saved" style="margin-top:16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FC8A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span>Saved to the Meals calendar · shows on the kitchen screen</span></div>
  </section>

  <section id="v-lunches" aria-labelledby="h-lunches" hidden>
    <div class="head">
      <div>
        <div class="kicker">Home HQ</div>
        <h1 id="h-lunches">Lunches</h1>
        <div class="sub" id="l-sub">&nbsp;</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="pill" id="l-today" type="button" aria-label="Back to this week">Today</button>
        <button class="round" id="l-prev" aria-label="Previous week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="round" id="l-next" aria-label="Next week"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="people" id="people" role="group" aria-label="Whose lunches" style="margin-top:18px"></div>
    <div class="days" id="ldays" style="margin-top:18px"></div>
    <div class="saved" style="margin-top:16px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FC8A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span id="l-note">Saved to the Meals calendar · shows on the kitchen screen</span></div>
  </section>

  <section id="v-groceries" aria-labelledby="h-groceries" hidden>
    <div class="kicker">Home HQ</div>
    <h1 id="h-groceries">Groceries</h1>
    <div class="sub" id="g-sub">&nbsp;</div>
    <form class="addrow" id="addform" style="margin-top:18px" autocomplete="off">
      <input type="text" id="addbox" placeholder="Add an item, press Enter" aria-label="Add a grocery item" enterkeyhint="enter" maxlength="80">
      <button class="plus" type="submit" aria-label="Add item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10251B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <div class="list" id="list" style="margin-top:12px"></div>
  </section>

  <div class="status" id="status" role="status"></div>
</main>

<div id="toast" role="status" hidden><span id="toast-text"></span><button id="toast-undo" type="button">Undo</button></div>

<nav aria-label="Sections" id="nav" hidden>
  <button type="button" id="tab-groceries"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Groceries<span class="badge" id="badge" hidden></span></button>
  <button type="button" id="tab-dinners"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11"/></svg>Dinners</button>
  <button type="button" id="tab-lunches"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 12h18"/></svg>Lunches</button>
</nav>

<script>
'use strict';
/* Home HQ phone app. Talks to the Home HQ Google script (the same one the kitchen Pi uses).
 * The connection comes from the private link: ?d=<deployment id>&k=<key>. It stays in the
 * link (so a home-screen icon keeps working) and is remembered on this device. Nothing
 * private is stored in this code. */
var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var S = { view: null, week: 0, dinners: {}, lunches: {}, people: [], person: recall('hq.person'), picks: [], items: [], pending: 0, last: null, loaded: false, tmp: 0 };
var CONN = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ---------- connection ---------- */
function connFrom(search) {
  var q = new URLSearchParams(search);
  var k = q.get('k'), d = q.get('d'), u = q.get('u');
  if (!k || !/^[A-Za-z0-9]{8,64}$/.test(k)) return null;
  var url = null;
  if (d && /^[A-Za-z0-9_-]{20,120}$/.test(d)) url = 'https://script.google.com/macros/s/' + d + '/exec';
  else if (u && /^(https:\/\/script\.google\.com\/|http:\/\/127\.0\.0\.1:\d+\/)/.test(u)) url = u; // u= is for testing
  return url ? { url: url, key: k } : null;
}
function connect() {
  CONN = connFrom(location.search);
  if (CONN) { store('hq.conn', JSON.stringify(CONN)); return true; }
  try { CONN = JSON.parse(recall('hq.conn') || 'null'); } catch (e) { CONN = null; }
  return !!(CONN && CONN.url && CONN.key);
}
$('setupform').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = $('setupbox').value.trim(), i = v.indexOf('?');
  var c = i === -1 ? null : connFrom(v.slice(i));
  if (!c) { setStatus('That doesn’t look like a Home HQ link. It should contain “?d=” and “&k=”.'); return; }
  location.href = location.pathname + v.slice(i); // reload with the link, so the home-screen icon can keep it
});

function api(name, params, ok) {
  var q = new URLSearchParams(params || {});
  q.set('api', name); q.set('key', CONN.key);
  fetch(CONN.url + '?' + q.toString(), { credentials: 'omit', cache: 'no-store', redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.error) throw new Error(j.error);
      setStatus('');
      if (ok) ok(j.result);
    })
    .catch(function (e) {
      var m = String(e && e.message);
      var id = (CONN.url.match(/\/s\/([^/]+)\//) || [])[1] || CONN.url;
      setStatus(/unauthorized/.test(m)
        ? 'This link’s key doesn’t match. Ask for the new Home HQ link.'
        : 'Couldn’t reach Home HQ (script ID ending …' + id.slice(-6) + '). If you’re online, this link may point to the wrong script ID; it will retry.');
      if (ok) ok(null, e);
    });
}
function setStatus(t) { $('status').textContent = t; }

/* ---------- loading ---------- */
function weekDays() {
  var t = new Date(); t.setHours(0, 0, 0, 0);
  var out = [];
  for (var i = 0; i < 7; i++) { var d = new Date(t); d.setDate(t.getDate() - t.getDay() + S.week * 7 + i); out.push(d); }
  return out;
}
function load() {
  var week = S.week;
  api('data', { week: ymd(weekDays()[0]) }, function (d) {
    if (!d) return;
    S.loaded = true;
    S.picks = d.picks || [];
    S.people = d.people || [];
    if (week === S.week) { S.dinners = d.dinners || {}; S.lunches = d.lunches || {}; renderDinners(); renderLunches(); }
    if (!S.pending) { S.items = d.groceries || []; renderGroceries(); }
  });
}

/* ---------- dinners ---------- */
function renderDinners() {
  var days = weekDays();
  var today = ymd(new Date());
  var first = days[0], last = days[6];
  var planned = 0;
  days.forEach(function (d) { if ((S.dinners[ymd(d)] || '').trim()) planned++; });
  $('d-sub').innerHTML = esc(weekLabel(days)) +
    '<br><span style="color:var(--muted)">' + (S.loaded ? planned + ' of 7 planned' : 'loading…') + '</span>';
  $('today').disabled = S.week === 0; // already showing this week
  var box = $('days');
  // Keep whatever is being typed: only rebuild rows when the week (or the day) changes.
  var stamp = S.week + '/' + today;
  if (box.dataset.stamp !== stamp) {
    box.dataset.stamp = stamp;
    box.innerHTML = days.map(function (d, i) {
      var k = ymd(d), isToday = k === today;
      return '<label class="day' + (isToday ? ' today' : '') + '"><span class="dl"><span class="dow">' + (isToday ? 'Today' : DOW[d.getDay()]) + '</span>' +
        '<span class="date">' + d.getDate() + '</span></span>' +
        '<input type="text" data-day="' + k + '" data-i="' + i + '" maxlength="80" enterkeyhint="next" placeholder="What’s for dinner?" aria-label="Dinner on ' + DOW_LONG[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() + '"></label>';
    }).join('');
  }
  Array.prototype.forEach.call(box.querySelectorAll('input'), function (inp) {
    if (inp === document.activeElement) return;
    var v = S.dinners[inp.dataset.day] || '';
    inp.value = v; inp.dataset.saved = v;
  });
  var thisWeek = {};
  days.forEach(function (d) { thisWeek[(S.dinners[ymd(d)] || '').toLowerCase()] = 1; });
  var picks = S.picks.filter(function (p) { return !thisWeek[p.toLowerCase()]; }).slice(0, 6);
  $('picks-wrap').hidden = !picks.length;
  $('picks').innerHTML = picks.map(function (p) { return '<button type="button" class="chip" data-pick="' + esc(p) + '">' + esc(p) + '</button>'; }).join('');
}
function saveDinner(inp) {
  var v = inp.value.trim();
  if (v === (inp.dataset.saved || '')) return;
  inp.dataset.saved = v;
  S.dinners[inp.dataset.day] = v;
  renderDinners();
  api('dinner', { day: inp.dataset.day, text: v }, function (r) { if (!r) inp.dataset.saved = ''; });
}
$('days').addEventListener('change', function (e) { if (e.target.dataset.day) saveDinner(e.target); });
$('days').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target.dataset.day) return;
  e.preventDefault();
  saveDinner(e.target);
  var next = $('days').querySelector('input[data-i="' + (Number(e.target.dataset.i) + 1) + '"]');
  if (next) next.focus(); else e.target.blur();
});
$('picks').addEventListener('click', function (e) {
  var b = e.target.closest('[data-pick]');
  if (!b) return;
  var open = Array.prototype.filter.call($('days').querySelectorAll('input'), function (i) { return !i.value.trim(); })[0];
  if (!open) { toast('Every night is planned', false); return; }
  open.value = b.dataset.pick;
  saveDinner(open);
});
function goWeek(w) {
  if (w === S.week) return;
  S.week = w; S.dinners = {}; S.lunches = {}; S.loaded = false;
  renderDinners(); renderLunches(); load();
}
['', 'l-'].forEach(function (p) {
  $(p + 'prev').addEventListener('click', function () { goWeek(S.week - 1); });
  $(p + 'next').addEventListener('click', function () { goWeek(S.week + 1); });
  $(p + 'today').addEventListener('click', function () { goWeek(0); });
});
function weekLabel(days) {
  var first = days[0], last = days[6];
  return MON[first.getMonth()] + ' ' + first.getDate() + ' – ' + (last.getMonth() !== first.getMonth() ? MON[last.getMonth()] + ' ' : '') + last.getDate();
}

/* ---------- lunches (one person at a time) ---------- */
function currentPerson() {
  var names = S.people.map(function (p) { return p.name; });
  if (S.person && names.indexOf(S.person) !== -1) return S.person;
  // First visit: start with someone whose lunches aren't filled in automatically.
  var manual = S.people.filter(function (p) {
    var l = S.lunches[p.name] || {};
    return !Object.keys(l).some(function (k) { return l[k].synced; }) && p.name !== 'Family';
  })[0];
  return manual ? manual.name : (names[0] || null);
}
function renderLunches() {
  var days = weekDays(), today = ymd(new Date());
  var who = currentPerson();
  var mine = (who && S.lunches[who]) || {};
  var planned = days.filter(function (d) { var e = mine[ymd(d)]; return e && e.text; }).length;
  $('l-sub').innerHTML = esc(weekLabel(days)) + '<br><span style="color:var(--muted)">' +
    (!S.loaded ? 'loading…' : (who ? planned + ' of 7 planned' : '')) + '</span>';
  $('l-today').disabled = S.week === 0;
  $('people').innerHTML = S.people.map(function (p) {
    return '<button type="button" class="person" data-person="' + esc(p.name) + '" aria-pressed="' + (p.name === who) + '">' +
      '<span class="pdot" style="background:' + esc(p.color) + '"></span>' + esc(p.name) + '</button>';
  }).join('');
  var synced = days.some(function (d) { var e = mine[ymd(d)]; return e && e.synced; });
  $('l-note').textContent = synced
    ? 'School lunches fill in automatically · others save to the Meals calendar'
    : 'Saved to the Meals calendar · shows on the kitchen screen';
  var box = $('ldays');
  var sig = days.map(function (d) { var e = mine[ymd(d)]; return e && e.synced ? 's' : '-'; }).join('');
  var stamp = S.week + '/' + today + '/' + who + '/' + sig;
  if (box.dataset.stamp !== stamp) {
    box.dataset.stamp = stamp;
    var n = 0;
    box.innerHTML = days.map(function (d) {
      var k = ymd(d), isToday = k === today, e = mine[k];
      var label = '<span class="dl"><span class="dow">' + (isToday ? 'Today' : DOW[d.getDay()]) + '</span><span class="date">' + d.getDate() + '</span></span>';
      if (e && e.synced) {
        return '<div class="day' + (isToday ? ' today' : '') + '">' + label +
          '<span class="fixed"><span>' + esc(e.text) + '</span><span class="tag">School</span></span></div>';
      }
      return '<label class="day' + (isToday ? ' today' : '') + '">' + label +
        '<input type="text" data-day="' + k + '" data-i="' + (n++) + '" maxlength="80" enterkeyhint="next" placeholder="What’s for lunch?" aria-label="' +
        esc(who || '') + ' lunch on ' + DOW_LONG[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() + '"></label>';
    }).join('');
  }
  Array.prototype.forEach.call(box.querySelectorAll('input'), function (inp) {
    if (inp === document.activeElement) return;
    var e = mine[inp.dataset.day];
    var v = e && !e.synced ? e.text : '';
    inp.value = v; inp.dataset.saved = v;
  });
}
function saveLunch(inp) {
  var who = currentPerson();
  var v = inp.value.trim();
  if (!who || v === (inp.dataset.saved || '')) return;
  inp.dataset.saved = v;
  S.lunches[who] = S.lunches[who] || {};
  if (v) S.lunches[who][inp.dataset.day] = { text: v, synced: false };
  else delete S.lunches[who][inp.dataset.day];
  renderLunches();
  api('lunch', { day: inp.dataset.day, who: who, text: v }, function (r, err) {
    if (r) return;
    inp.dataset.saved = '';
    if (/synced/.test(String(err && err.message))) { toast('That day’s school lunch fills in automatically', false); load(); }
  });
}
$('people').addEventListener('click', function (e) {
  var b = e.target.closest('[data-person]');
  if (!b) return;
  S.person = b.dataset.person;
  store('hq.person', S.person);
  renderLunches();
});
$('ldays').addEventListener('change', function (e) { if (e.target.dataset.day) saveLunch(e.target); });
$('ldays').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target.dataset.day) return;
  e.preventDefault();
  saveLunch(e.target);
  var next = $('ldays').querySelector('input[data-i="' + (Number(e.target.dataset.i) + 1) + '"]');
  if (next) next.focus(); else e.target.blur();
});

/* ---------- groceries ---------- */
function openItems() { return S.items.filter(function (i) { return !i.done; }); }
function renderGroceries() {
  var open = openItems();
  $('g-sub').textContent = (open.length ? open.length + ' to get' : 'All set') + ' · synced with Google Tasks';
  $('badge').textContent = open.length; $('badge').hidden = !open.length;
  $('list').innerHTML = open.length
    ? open.map(function (it) { return '<button type="button" class="item" data-id="' + esc(it.id) + '" aria-label="Check off ' + esc(it.text) + '"><span class="box"></span>' + esc(it.text) + '</button>'; }).join('')
    : (S.loaded ? '<div class="empty">All set — nothing to get.</div>' : '<div class="empty">Loading…</div>');
}
function sendGrocery(name, params) {
  S.pending++;
  api(name, params, function (list) {
    S.pending--;
    if (list && !S.pending) { S.items = list; renderGroceries(); }
  });
}
$('addform').addEventListener('submit', function (e) {
  e.preventDefault();
  var box = $('addbox'), text = box.value.trim();
  box.focus(); // keep the keyboard up for the next item
  if (!text) return;
  var dup = openItems().some(function (i) { return i.text.toLowerCase() === text.toLowerCase(); });
  box.value = '';
  if (dup) { toast('“' + text + '” is already on the list', false); return; }
  S.items.unshift({ id: 'tmp' + (++S.tmp), text: text, done: false });
  renderGroceries();
  sendGrocery('add', { text: text });
});
$('list').addEventListener('click', function (e) {
  var b = e.target.closest('[data-id]');
  if (!b) return;
  var it = S.items.filter(function (i) { return String(i.id) === b.dataset.id; })[0];
  if (!it || String(it.id).indexOf('tmp') === 0) return; // still saving; try again in a second
  it.done = true;
  S.last = it;
  renderGroceries();
  toast('Got “' + it.text + '”', true);
  sendGrocery('toggle', { id: it.id, done: 'true' });
});
$('toast-undo').addEventListener('click', function () {
  var it = S.last;
  hideToast();
  if (!it) return;
  it.done = false; S.last = null;
  renderGroceries();
  sendGrocery('toggle', { id: it.id, done: 'false' });
});

/* ---------- toast, tabs, refresh ---------- */
var toastTimer = null;
function toast(text, undo) {
  $('toast-text').textContent = text;
  $('toast-undo').hidden = !undo;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 6000 : 2500);
}
function hideToast() { clearTimeout(toastTimer); $('toast').hidden = true; }
function show(view) {
  if (view !== S.view) hideToast();
  S.view = view;
  $('v-dinners').hidden = view !== 'dinners';
  $('v-groceries').hidden = view !== 'groceries';
  $('v-lunches').hidden = view !== 'lunches';
  $('tab-lunches').setAttribute('aria-current', view === 'lunches' ? 'page' : 'false');
  $('tab-dinners').setAttribute('aria-current', view === 'dinners' ? 'page' : 'false');
  $('tab-groceries').setAttribute('aria-current', view === 'groceries' ? 'page' : 'false');
  window.scrollTo(0, 0);
}
$('tab-dinners').addEventListener('click', function () { show('dinners'); });
$('tab-groceries').addEventListener('click', function () { show('groceries'); });
$('tab-lunches').addEventListener('click', function () { show('lunches'); });

if (connect()) {
  $('nav').hidden = false;
  show('groceries'); // always opens on Groceries
  renderDinners(); renderLunches(); renderGroceries();
  load();
  setInterval(function () { if (!document.hidden) load(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
} else {
  $('v-setup').hidden = false;
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () { /* works without it */ });
}
</script>
</body>
